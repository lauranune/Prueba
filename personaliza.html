<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Personaliza tu coche</title>
</head>
<body>
    <nav class="navbar navbar-light bg-white sticky-top container-fluid">
        <div class="row w-100 align-items-center justify-content-between px-3">
        <!-- Iconos izquierda -->
        <div class="col-auto d-flex align-items-center">
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral"
                aria-controls="menuLateral">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="logo ms-2">
                <img src="./resource/TeslaLogo.png" alt="Logo" class="img-fluid" width="60px">
            </div>
        </div>

        <!-- Search -->
        <div class="col text-center">
            <form class="form-inline d-inline-block w-75">
                <div class="input-container position-relative">
                    <img class="form-submit lupa position-absolute top-50 start-0 translate-middle-y ms-2" src="./resource/lupa.png" alt="buscar" width="20">
                    <input class="form-control ps-5" type="search" placeholder="Busca en Tesla" aria-label="Search">
                </div>
            </form>
        </div>

        <!-- Iconos derecha -->
        <div class="col-auto d-flex align-items-center">
            <div class="me-3 d-flex flex-column align-items-center">
                <img class="navbar-icon" src="./resource/HomeLogo.png" alt="tiendas" width="20px">
                <span class="navbar-text-right">Tiendas</span>
            </div>
            <div class="me-3 d-flex flex-column align-items-center">
                <img class="navbar-icon" src="./resource/usuario.png" alt="usuario" width="20px">
                <span class="ms-1">Identifícate</span>
            </div>
        </div>
            <!-- Menú lateral -->
        <div class="offcanvas offcanvas-start bg-white text-black" tabindex="-1" id="menuLateral" aria-labelledby="menuLateralLabel">
            <div class="offcanvas-header">
                <img src="./resource/TeslaLogo.png" alt="Logo" class="img-fluid" width="60px">
                <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="list-unstyled">
                    <li><a href="./index.html" class="text-black">Inicio</a></li>
                    <li><a href="./datos.html" class="text-black">Formulario</a></li>
                    <li><a href="./contador.html" class="text-black">Contador</a></li>
                    <li><a href="./personaliza.html" class="text-black">Personaliza tu coche</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="container py-5">
        <div class="row">
            <div class="col justify-content-center text-center g-1">
                <div >
                    <img id="cambiarColor" src="./resource/cocheColorR.png" style="background-color: white;">
                </div>
            </div>
            <div class="col justify-content-center text-center">
                <h1>Personaliza el color de tu coche</h1>
                <h3>¿Qué color te gustaría?</h3>
                <ul class="list-unstyled justify-content-center">
                    <br>
                    <li><button id="clickColor1"style="background-color: white; color: black;">Blanco</button></li>
                    <br>
                    <li><button id="clickColor2"style="background-color: black; color: antiquewhite;">Negro</button></li>
                    <br>
                    <li><button id="clickColor3"style="background-color: red; color: azure;">Rojo</button></li>
                    <br>
                    <li><button id="clickColor4"style="background-color: orange;">Naranja</button></li>
                </ul>
            </div>
        </div>
    </section>
    <hr>
    <section class="container py-5">
        <div class="row justify-content-center text-center" id="botonesColores">
            <h1>Botones</h1>
            <div class="col py-3">
                <button type="button" class="btn btn-primary boton-color"> Rojo</button>
                <button type="button" class="btn btn-primary boton-color" > Amarillo</button>
                <button type="button" class="btn btn-primary boton-color" > Verde</button>
            </div>
            <div class="col py-3">
                <button type="button" class="btn btn-primary boton-random">RANDOM</button>

            </div>
        </div>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./colorCoche.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</body>
    
</html>
